[package]
name = "db"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["format", "util"]

[dependencies]
jsonb = { git = "https://github.com/J-Cake/jsonb", branch = "fix-todo-items" }
serde = { version = "1.0.229" }
serde_json = "1.0.151"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
clap = { version = "4.6.7", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
util = { path = "./util" }
format = { path = "./format" }

[features]
debug = ["clap"]

[[bin]]
name = "repl"
path = "src/bin/repl.rs"
required-features = ["debug"]
