[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonb = "0.5.6"
serde = { version = "1.0.229" }
serde_json = "1.0.151"
nom = "8.0.0"
uuid = { version = "1.29.0", features = ["v4"] }
clap = { version = "4.6.7", optional = true }
chrono = "0.4.45"

[features]
debug = ["clap"]

[[bin]]
name = "repl"
path = "src/bin/repl.rs"
required-features = ["debug"]