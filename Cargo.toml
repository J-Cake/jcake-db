[package]
name = "db"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["format", "util"]

[dependencies]
jsonb = { git = "https://github.com/J-Cake/jsonb", branch = "fix-todo-items" }
serde = { version = "1.0.229" }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
util = { path = "./util" }
format = { path = "./format" }

clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
serde_json = { version = "1.0.151", optional = true }
axum = { version = "0.8.9", optional = true }
tokio = { version = "1.54.1", optional = true, features = ["full"] }
jaq-core = { version = "3.1.2", optional = true }
jaq-json = { version = "2.0.3", optional = true, features = ["serde"] }
jaq-std = { version = "3.0.4", optional = true }
axum-core = { version = "0.5.6", optional = true }
hyper = { version = "1.12.0", optional = true }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
base64 = { version = "0.23.1", optional = true }
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
libc = "0.2.191"

[features]
web = [
    "clap/derive", "clap/env",
    "axum-core", "axum/macros",
    "tokio/full",
    "serde_json",
    "chrono/now", "chrono/serde",
    "jaq-core", "jaq-json/serde", "jaq-std",
    "hyper", "hyper-util/client", "hyper-util/http2", "hyper-util/tokio", "http-body-util",
    "base64",
    "hmac", "sha2"
]

[[bin]]
name = "repl"
path = "src/bin/repl.rs"
required-features = ["web"]

[[bin]]
name = "web"
path = "src/bin/web/main.rs"
required-features = ["web"]
